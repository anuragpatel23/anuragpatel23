name: 🧊 Generate 3D Contribution Calendar

on:
  schedule:
    # Runs daily at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Use a fine-grained PAT or classic PAT with read:user scope
          # stored as METRICS_TOKEN in repo Settings → Secrets → Actions
          # If you don't have one yet, GITHUB_TOKEN works but may hit rate limits
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          user: anuragpatel23

          # Output goes to profile-3d-contrib/profile-night-rainbow.svg on main
          filename: profile-3d-contrib/profile-night-rainbow.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: regenerate 3D contribution calendar [skip ci]"

          # Minimal base — only the isocalendar plugin
          template: classic
          base: ""
          config_output: svg
          config_padding: 6, 10

          # Isometric contribution calendar (the 3D-looking one)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
