name: 🧊 Generate 3D Contribution Calendar

on:
  schedule:
    # Runs daily at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: anuragpatel23
          # No SETTING_JSON → generates ALL default themed SVGs,
          # including profile-night-rainbow.svg used in the README

      - name: Commit & Push generated SVGs
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A .
          git diff --cached --quiet || git commit -m "chore: regenerate 3D contribution calendar [skip ci]"
          git push
